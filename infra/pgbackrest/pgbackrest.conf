# pgBackRest (TAD §11.6). Repo1 = direktori host BV_BACKUP_DIR (/opt/bv-backup) yang di-mount ke container postgres;
# scripts/pg-backup.sh mirror menyalinnya ke MinIO bucket bv-backup / S3-R2 lokasi lain (pgBackRest ke S3 mewajibkan TLS,
# MinIO lokal berjalan HTTP). Full harian 02:00, incremental 08/14/20 (cron user bv), WAL archiving kontinu, retensi 14 full.
[global]
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-retention-full=14
repo1-retention-full-type=count
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
spool-path=/var/spool/pgbackrest
archive-async=y
start-fast=y
delta=y

[bv]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
