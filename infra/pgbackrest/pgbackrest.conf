# pgBackRest (TAD §11.6): repo1 = object storage S3-compatible di LOKASI BERBEDA dari VPS (mis. bucket R2/S3 region lain).
# Full harian, incremental tiap 6 jam (crontab), WAL archiving kontinu (archive_command di postgres), retensi 30 hari, PITR.
# Ganti kredensial/endpoint sebelum produksi — file ini di-mount read-only ke container postgres & pgbackrest.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-bucket=bv-backup
repo1-s3-endpoint=minio
repo1-s3-uri-style=path
repo1-s3-region=ap-southeast-3
repo1-s3-key=minioadmin
repo1-s3-key-secret=minioadmin
repo1-s3-verify-tls=n
repo1-retention-full=30
repo1-retention-full-type=time
repo1-retention-archive=30
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
log-level-console=info
log-level-file=detail
archive-async=y
spool-path=/var/spool/pgbackrest
start-fast=y
delta=y

[bv]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
