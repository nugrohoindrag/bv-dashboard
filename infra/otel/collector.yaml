# OTel Collector: menerima OTLP (trace/metrics) dari api/worker (opsional P0; slog + Prometheus adalah minimum TAD §11.5),
# meneruskan trace ke Tempo/Grafana Cloud bila dikonfigurasi. Sampling 10%, 100% error.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  tail_sampling:
    decision_wait: 5s
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: probabilistic, type: probabilistic, probabilistic: { sampling_percentage: 10 } }
exporters:
  debug: { verbosity: basic }
  # otlp/tempo: { endpoint: tempo:4317, tls: { insecure: true } }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [tail_sampling, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }
