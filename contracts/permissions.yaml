# BuildingVision Permission Catalog (PRD §18, Naming Convention §61)
# Format: {module}.{object}.{action}
# Sumber tunggal untuk: Go constants (api/internal/iam/permissions.go), seed DB, dokumentasi.
version: 1
modules:
  platform:
    organizations: [view, update]
    audit_logs: [view]
    exports: [create]
  iam:
    users: [view, create, update, deactivate, reset_password]
    roles: [view, create, update, delete]
    teams: [view, create, update, delete, manage_members]
  property:
    properties: [view, create, update]
    locations: [view, create, update, delete]
    tenants: [view, create, update]
    occupants: [view, create, update]
  operations:
    tasks: [view, create, update, assign, start, complete, close, cancel, manage]
    work_orders: [view, create, update, assign, start, complete, close, reopen, cancel, manage]
    incidents: [view, create, update, assign, resolve, close, manage]
    findings: [view, create, update, resolve, close, manage]
    checklists: [view, create, update, publish, archive]
    sla_policies: [view, create, update]
    comments: [create]
    attachments: [create, delete]
  engineering:
    assets: [view, create, update, decommission]
    equipment: [view, create, update]
    maintenance_plans: [view, create, update, publish, archive]
    maintenance_schedules: [view, skip]
    inspections: [view, create, update, complete, close]
  security:
    patrol: [view, manage, start, complete]
    patrol_routes: [view, create, update, delete]
    checkpoints: [view, create, update, delete]
    incidents: [view, create, manage]
  housekeeping:
    cleaning: [view, assign, start, complete, manage]
    cleaning_schedules: [view, create, update, delete]
    inspections: [view, create, complete, close]
  tenant:
    service_requests: [view, create, update, acknowledge, assign, resolve, close, cancel, manage]
  notification:
    inbox: [view]
  overview:
    dashboard: [view]
  search:
    global: [view]
  sync:
    work_bundle: [view]
    mutations: [create]
    conflicts: [view, acknowledge]

# Role template (Naming Convention §31) — di-seed is_system=true per Organization.
# OD-007 final matrix pending; baseline berikut dipakai sampai diputuskan.
# Pattern: "*" = semua; "module.*" = semua object+action dalam module; "module.*.view" = action view semua object module.
roles:
  organization_admin:
    label: Organization Admin
    permissions: ["*"]
  property_manager:
    label: Property Manager
    permissions: ["platform.*", "iam.*.view", "property.*", "operations.*", "engineering.*", "security.*", "housekeeping.*", "tenant.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create"]
  building_manager:
    label: Building Manager
    permissions: ["iam.*.view", "property.*.view", "operations.*", "engineering.*.view", "security.*.view", "housekeeping.*.view", "tenant.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create"]
  operations_manager:
    label: Operations Manager
    permissions: ["property.*.view", "operations.*", "tenant.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create"]
  engineering_manager:
    label: Engineering Manager
    permissions: ["property.*.view", "operations.tasks.*", "operations.work_orders.*", "operations.findings.*", "operations.checklists.*", "operations.comments.*", "operations.attachments.*", "engineering.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create"]
  engineering_supervisor:
    label: Engineering Supervisor
    permissions: ["property.*.view", "operations.tasks.*", "operations.work_orders.*", "operations.findings.*", "operations.checklists.view", "operations.comments.*", "operations.attachments.*", "engineering.*.view", "engineering.inspections.*", "engineering.maintenance_schedules.*", "notification.*", "overview.*", "search.*", "sync.*", "platform.exports.create"]
  technician:
    label: Technician
    permissions: ["property.*.view", "operations.tasks.view", "operations.tasks.start", "operations.tasks.complete", "operations.work_orders.view", "operations.work_orders.create", "operations.work_orders.start", "operations.work_orders.complete", "operations.findings.view", "operations.findings.create", "operations.comments.create", "operations.attachments.create", "engineering.assets.view", "engineering.equipment.view", "engineering.inspections.view", "engineering.inspections.complete", "notification.inbox.view", "search.global.view", "sync.work_bundle.view", "sync.mutations.create"]
  security_manager:
    label: Security Manager
    permissions: ["property.*.view", "operations.tasks.*", "operations.incidents.*", "operations.findings.*", "operations.checklists.*", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "security.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create"]
  security_supervisor:
    label: Security Supervisor
    permissions: ["property.*.view", "operations.tasks.*", "operations.incidents.*", "operations.findings.*", "operations.checklists.view", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "security.*", "notification.*", "overview.*", "search.*", "sync.*", "platform.exports.create"]
  security_officer:
    label: Security Officer
    permissions: ["property.*.view", "operations.tasks.view", "operations.tasks.start", "operations.tasks.complete", "operations.incidents.view", "operations.incidents.create", "operations.findings.view", "operations.findings.create", "operations.comments.create", "operations.attachments.create", "security.patrol.view", "security.patrol.start", "security.patrol.complete", "security.incidents.view", "security.incidents.create", "notification.inbox.view", "search.global.view", "sync.work_bundle.view", "sync.mutations.create"]
  housekeeping_manager:
    label: Housekeeping Manager
    permissions: ["property.*.view", "operations.tasks.*", "operations.findings.*", "operations.checklists.*", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "housekeeping.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create"]
  housekeeping_supervisor:
    label: Housekeeping Supervisor
    permissions: ["property.*.view", "operations.tasks.*", "operations.findings.*", "operations.checklists.view", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "housekeeping.*", "notification.*", "overview.*", "search.*", "sync.*", "platform.exports.create"]
  housekeeping_staff:
    label: Housekeeping Staff
    permissions: ["property.*.view", "operations.tasks.view", "operations.tasks.start", "operations.tasks.complete", "operations.findings.view", "operations.findings.create", "operations.comments.create", "operations.attachments.create", "housekeeping.cleaning.view", "housekeeping.cleaning.start", "housekeeping.cleaning.complete", "notification.inbox.view", "search.global.view", "sync.work_bundle.view", "sync.mutations.create"]
