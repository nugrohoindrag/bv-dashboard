# BuildingVision Permission Catalog (PRD §18, Naming Convention §61)
# Format: {module}.{object}.{action}
# Sumber tunggal untuk: Go constants (api/internal/iam/permissions.go), seed DB, dokumentasi.
version: 1
modules:
  platform:
    organizations: [view, update]
    audit_logs: [view]
    exports: [create]
    app_downloads: [view, manage]       # Website PRD §16–§19: hanya role admin_internal pada organization internal (dicek server-side)
  iam:
    users: [view, create, update, deactivate, reset_password]
    roles: [view, create, update, delete]
    teams: [view, create, update, delete, manage_members]
  property:
    properties: [view, create, update, change_profile]
    locations: [view, create, update, delete]
    tenants: [view, create, update]
    occupants: [view, create, update]
  operations:
    tasks: [view, create, update, assign, start, complete, close, cancel, manage]
    work_orders: [view, create, update, assign, start, complete, close, reopen, cancel, manage]
    incidents: [view, create, update, assign, resolve, close, manage]
    findings: [view, create, update, resolve, close, manage]
    checklists: [view, create, update, publish, archive]
    sla_policies: [view, create, update]
    comments: [create]
    attachments: [create, delete]
  engineering:
    assets: [view, create, update, decommission]
    equipment: [view, create, update]
    maintenance_plans: [view, create, update, publish, archive]
    maintenance_schedules: [view, skip]
    inspections: [view, create, update, complete, close]
  security:
    patrol: [view, manage, start, complete]
    patrol_routes: [view, create, update, delete]
    checkpoints: [view, create, update, delete]
    incidents: [view, create, manage]
    visitors: [view, create, update, verify, manage]
  housekeeping:
    cleaning: [view, assign, start, complete, manage]
    cleaning_schedules: [view, create, update, delete]
    inspections: [view, create, complete, close]
  tenant:
    service_requests: [view, create, update, acknowledge, assign, resolve, close, cancel, manage]
  # ---- P1 (PRD v1.3) ----
  tenant_relation:                      # modul Tenant Relation di Dashboard (PRD §3.2, brief §6)
    tenant_users: [view, validate, update, suspend]
    messages: [view, create]
    feedback: [view]
    announcements: [view, create, update, publish]
  tenant_app:                           # Mobile Tenant (consumer); tidak pernah diberikan ke staf
    profile: [view, update]
    requests: [view, create, cancel, confirm, reopen]
    messages: [view, create]
    feedback: [create]
    facilities: [view]
    bookings: [view, create, cancel]
    visitors: [view, create, cancel]
    invoices: [view]
    payments: [view, create]
    inbox: [view]
  booking:                              # Facility Booking (generic Booking, NC §72 #11)
    facilities: [view, create, update, delete]
    bookings: [view, create, update, approve, reject, cancel, check_in]
  billing:
    invoices: [view, create, update, issue, cancel, import]
    payments: [view, create, verify, refund]
  vendor:
    vendors: [view, create, update, deactivate]
    assignments: [view, create, update]
  inventory:
    items: [view, create, update, deactivate]
    stock_locations: [view, create, update]
    stock: [view, adjust]
    transactions: [view, create]
    parts_usage: [view, create]
  hotel:                                # Hotel Booking Management (profile hotel)
    room_types: [view, create, update, archive]
    rooms: [view, create, update, set_status]
    rates: [view, create, update, archive]
    reservations: [view, create, update, confirm, assign_room, check_in, check_out, cancel, no_show]
  commercial:                           # Apartment Unit Sales & Rental (profile apartment)
    unit_listings: [view, create, update, publish, archive]
    sales_leads: [view, create, update]
    sale_reservations: [view, create, update, cancel, complete]
    rental_listings: [view, create, update, publish, archive]
    rental_reservations: [view, create, update, confirm, activate, complete, cancel]
  reports:
    reports: [view, export]
  notification:
    inbox: [view]
  overview:
    dashboard: [view]
  search:
    global: [view]
  sync:
    work_bundle: [view]
    mutations: [create]
    conflicts: [view, acknowledge]

# Role template (Naming Convention §31) — di-seed is_system=true per Organization.
# OD-007 final matrix pending; baseline berikut dipakai sampai diputuskan.
# Pattern: "*" = semua; "module.*" = semua object+action dalam module; "module.*.view" = action view semua object module.
roles:
  organization_admin:
    label: Organization Admin
    permissions: ["*"]
  property_manager:
    label: Property Manager
    permissions: ["platform.*", "iam.*.view", "property.*", "operations.*", "engineering.*", "security.*", "housekeeping.*", "tenant.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create", "tenant_relation.*", "booking.*", "billing.*", "vendor.*", "inventory.*", "hotel.*", "commercial.*", "reports.*"]
  building_manager:
    label: Building Manager
    permissions: ["iam.*.view", "property.*.view", "operations.*", "engineering.*.view", "security.*.view", "housekeeping.*.view", "tenant.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create", "tenant_relation.*", "booking.*", "billing.*.view", "vendor.*", "inventory.*", "hotel.*", "commercial.*", "reports.*"]
  operations_manager:
    label: Operations Manager
    permissions: ["property.*.view", "operations.*", "tenant.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create", "tenant_relation.*", "booking.*", "security.visitors.*", "vendor.*.view", "inventory.*.view", "hotel.*.view", "commercial.*.view", "reports.*"]
  engineering_manager:
    label: Engineering Manager
    permissions: ["property.*.view", "operations.tasks.*", "operations.work_orders.*", "operations.findings.*", "operations.checklists.*", "operations.comments.*", "operations.attachments.*", "engineering.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create", "vendor.*", "inventory.*", "reports.reports.view"]
  engineering_supervisor:
    label: Engineering Supervisor
    permissions: ["property.*.view", "operations.tasks.*", "operations.work_orders.*", "operations.findings.*", "operations.checklists.view", "operations.comments.*", "operations.attachments.*", "engineering.*.view", "engineering.inspections.*", "engineering.maintenance_schedules.*", "notification.*", "overview.*", "search.*", "sync.*", "platform.exports.create", "vendor.*.view", "vendor.assignments.*", "inventory.*.view", "inventory.parts_usage.*", "inventory.transactions.*"]
  technician:
    label: Technician
    permissions: ["property.*.view", "operations.tasks.view", "operations.tasks.start", "operations.tasks.complete", "operations.work_orders.view", "operations.work_orders.create", "operations.work_orders.start", "operations.work_orders.complete", "operations.findings.view", "operations.findings.create", "operations.comments.create", "operations.attachments.create", "engineering.assets.view", "engineering.equipment.view", "engineering.inspections.view", "engineering.inspections.complete", "notification.inbox.view", "search.global.view", "sync.work_bundle.view", "sync.mutations.create", "inventory.items.view", "inventory.stock.view", "inventory.parts_usage.view", "inventory.parts_usage.create"]
  security_manager:
    label: Security Manager
    permissions: ["property.*.view", "operations.tasks.*", "operations.incidents.*", "operations.findings.*", "operations.checklists.*", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "security.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create", "reports.reports.view"]
  security_supervisor:
    label: Security Supervisor
    permissions: ["property.*.view", "operations.tasks.*", "operations.incidents.*", "operations.findings.*", "operations.checklists.view", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "security.*", "notification.*", "overview.*", "search.*", "sync.*", "platform.exports.create", "vendor.*.view", "vendor.assignments.*"]
  security_officer:
    label: Security Officer
    permissions: ["property.*.view", "operations.tasks.view", "operations.tasks.start", "operations.tasks.complete", "operations.incidents.view", "operations.incidents.create", "operations.findings.view", "operations.findings.create", "operations.comments.create", "operations.attachments.create", "security.patrol.view", "security.patrol.start", "security.patrol.complete", "security.incidents.view", "security.incidents.create", "notification.inbox.view", "search.global.view", "sync.work_bundle.view", "sync.mutations.create", "security.visitors.view", "security.visitors.verify"]
  housekeeping_manager:
    label: Housekeeping Manager
    permissions: ["property.*.view", "operations.tasks.*", "operations.findings.*", "operations.checklists.*", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "housekeeping.*", "notification.*", "overview.*", "search.*", "sync.conflicts.*", "platform.exports.create", "hotel.rooms.view", "hotel.rooms.set_status", "hotel.reservations.view", "reports.reports.view"]
  housekeeping_supervisor:
    label: Housekeeping Supervisor
    permissions: ["property.*.view", "operations.tasks.*", "operations.findings.*", "operations.checklists.view", "operations.work_orders.view", "operations.work_orders.create", "operations.comments.*", "operations.attachments.*", "housekeeping.*", "notification.*", "overview.*", "search.*", "sync.*", "platform.exports.create", "hotel.rooms.view", "hotel.rooms.set_status", "hotel.reservations.view", "vendor.*.view", "vendor.assignments.*", "inventory.items.view", "inventory.stock.view", "inventory.transactions.*"]
  housekeeping_staff:
    label: Housekeeping Staff
    permissions: ["property.*.view", "operations.tasks.view", "operations.tasks.start", "operations.tasks.complete", "operations.findings.view", "operations.findings.create", "operations.comments.create", "operations.attachments.create", "housekeeping.cleaning.view", "housekeeping.cleaning.start", "housekeeping.cleaning.complete", "notification.inbox.view", "search.global.view", "sync.work_bundle.view", "sync.mutations.create", "hotel.rooms.view", "hotel.rooms.set_status"]
  # ---- P1 roles (NC §32; PRD §6 persona Tenant Relation, Receptionist, Finance, Tenant) ----
  tenant_relation_manager:
    label: Tenant Relation Manager
    permissions: ["property.*.view", "tenant.*", "tenant_relation.*", "operations.tasks.view", "operations.tasks.create", "operations.work_orders.view", "operations.work_orders.create", "operations.incidents.view", "operations.incidents.create", "operations.findings.view", "operations.comments.*", "operations.attachments.*", "booking.*", "security.visitors.view", "billing.*.view", "hotel.reservations.view", "commercial.*.view", "notification.*", "overview.*", "search.*", "platform.exports.create", "reports.reports.view"]
  tenant_relation_officer:
    label: Tenant Relation Officer
    permissions: ["property.*.view", "tenant.*", "tenant_relation.*", "operations.tasks.view", "operations.tasks.create", "operations.work_orders.view", "operations.work_orders.create", "operations.incidents.view", "operations.incidents.create", "operations.comments.*", "operations.attachments.*", "booking.*.view", "booking.bookings.create", "booking.bookings.approve", "booking.bookings.reject", "booking.bookings.cancel", "security.visitors.view", "billing.*.view", "notification.*", "overview.dashboard.view", "search.*"]
  receptionist:
    label: Receptionist
    permissions: ["property.*.view", "tenant.service_requests.view", "tenant.service_requests.create", "tenant.service_requests.acknowledge", "tenant_relation.messages.*", "tenant_relation.tenant_users.view", "hotel.*.view", "hotel.reservations.*", "hotel.rooms.set_status", "booking.*", "security.visitors.view", "security.visitors.create", "security.visitors.verify", "billing.invoices.view", "billing.payments.view", "billing.payments.create", "operations.tasks.view", "operations.tasks.create", "operations.comments.create", "operations.attachments.create", "notification.*", "search.*", "overview.dashboard.view"]
  finance_manager:
    label: Finance Manager
    permissions: ["property.*.view", "billing.*", "vendor.*.view", "commercial.*.view", "hotel.reservations.view", "reports.*", "notification.*", "overview.*", "search.*", "platform.exports.create"]
  finance_staff:
    label: Finance Staff
    permissions: ["property.*.view", "billing.*", "notification.*", "overview.dashboard.view", "search.*", "platform.exports.create"]
  # ---- Internal BuildingVision (Website PRD §18): di-seed HANYA ke organization is_internal (bvctl seed --internal) ----
  admin_internal:
    label: Admin Internal
    permissions: ["platform.app_downloads.*", "platform.organizations.view", "platform.audit_logs.view", "notification.inbox.view", "search.global.view"]
  tenant_admin:
    label: Tenant Admin
    permissions: ["tenant_app.*", "notification.inbox.view"]
  tenant_user:
    label: Tenant User
    permissions: ["tenant_app.*", "notification.inbox.view"]
